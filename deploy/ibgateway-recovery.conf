# IB Gateway authentication recovery policy

# User explicitly rejects the 2FA request:
# wait this many seconds before requesting 2FA again.
IBKR_2FA_REJECT_WAIT_SECONDS=900

# User does not respond to the 2FA request:
# wait this many seconds before requesting 2FA again.
IBKR_2FA_NO_RESPONSE_WAIT_SECONDS=300

# How often the Gateway/API health should be checked.
IBKR_GATEWAY_HEALTH_CHECK_SECONDS=30

# API port used by Python streamers.
IBKR_GATEWAY_API_PORT=7496
